<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ayde</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-stars"></div>

  <div class="container">
    <h1 class="logo">ayde</h1>

    <form id="search-form" autocomplete="off">
      <input 
        type="text" 
        id="search" 
        placeholder="search..." 
        autofocus
        autocomplete="off"
        spellcheck="false"
      >
    </form>

    <p class="hint">Press Enter to search with DuckDuckGo</p>

    <div class="section-header">
      <span>Quick apps</span>
    </div>

    <div class="apps-grid">
      <a href="https://youtube.com" class="app" target="_blank" rel="noopener">
        <div class="icon yt">▶</div>
        <span>YouTube</span>
      </a>
      <a href="https://github.com" class="app" target="_blank" rel="noopener">
        <div class="icon gh">⌥</div>
        <span>GitHub</span>
      </a>
      <a href="https://discord.com/app" class="app" target="_blank" rel="noopener">
        <div class="icon dc">💬</div>
        <span>Discord</span>
      </a>
      <a href="https://tiktok.com" class="app" target="_blank" rel="noopener">
        <div class="icon tt">♪</div>
        <span>TikTok</span>
      </a>

      <a href="https://google.com" class="app" target="_blank" rel="noopener">
        <div class="icon go">G</div>
        <span>Google</span>
      </a>
      <a href="https://x.com" class="app" target="_blank" rel="noopener">
        <div class="icon x">𝕏</div>
        <span>Twitter/X</span>
      </a>
      <a href="https://roblox.com" class="app" target="_blank" rel="noopener">
        <div class="icon rb">R</div>
        <span>Roblox</span>
      </a>
      <a href="https://play.geforcenow.com" class="app" target="_blank" rel="noopener">
        <div class="icon gfn">▶</div>
        <span>GeForce Now</span>
      </a>

      <a href="https://duckduckgo.com/?q=movies" class="app" target="_blank" rel="noopener">
        <div class="icon">🎬</div>
        <span>Movies</span>
      </a>
      <a href="https://duckduckgo.com/?q=games" class="app" target="_blank" rel="noopener">
        <div class="icon">🎮</div>
        <span>Games</span>
      </a>
      <a href="https://duckduckgo.com/?q=ai" class="app" target="_blank" rel="noopener">
        <div class="icon">✦</div>
        <span>AI</span>
      </a>
      <a href="https://duckduckgo.com/?q=play" class="app" target="_blank" rel="noopener">
        <div class="icon">▶</div>
        <span>Play</span>
      </a>

      <a href="https://duckduckgo.com/?q=music" class="app" target="_blank" rel="noopener">
        <div class="icon">🎵</div>
        <span>Music</span>
      </a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
