<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ayde</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-stars" id="stars"></div>

  <div class="tab-bar" id="tab-bar">
    <div class="tab active" data-tab="home" id="tab-home">
      <span>home</span>
    </div>
  </div>

  <div class="page" id="page-home">
    <div class="container">
      <h1 class="logo">ayde</h1>

      <form id="search-form" autocomplete="off">
        <input 
          type="text" 
          id="search" 
          placeholder="search..." 
          autofocus
          autocomplete="off"
          spellcheck="false"
        >
      </form>

      <p class="hint">press enter to search with duckduckgo</p>

      <div class="section-header">
        <span>quick apps</span>
      </div>

      <div class="apps-grid">
        <a href="https://youtube.com" class="app" data-url="https://youtube.com" data-title="YouTube">
          <div class="icon yt">▶</div>
          <span>YouTube</span>
        </a>
        <a href="https://github.com" class="app" data-url="https://github.com" data-title="GitHub">
          <div class="icon gh">⌥</div>
          <span>GitHub</span>
        </a>
        <a href="https://discord.com/app" class="app" data-url="https://discord.com/app" data-title="Discord">
          <div class="icon dc">💬</div>
          <span>Discord</span>
        </a>
        <a href="https://tiktok.com" class="app" data-url="https://tiktok.com" data-title="TikTok">
          <div class="icon tt">♪</div>
          <span>TikTok</span>
        </a>

        <a href="https://google.com" class="app" data-url="https://google.com" data-title="Google">
          <div class="icon go">G</div>
          <span>Google</span>
        </a>
        <a href="https://x.com" class="app" data-url="https://x.com" data-title="X">
          <div class="icon x">𝕏</div>
          <span>Twitter/X</span>
        </a>
        <a href="https://roblox.com" class="app" data-url="https://roblox.com" data-title="Roblox">
          <div class="icon rb">R</div>
          <span>Roblox</span>
        </a>
        <a href="https://play.geforcenow.com" class="app" data-url="https://play.geforcenow.com" data-title="GeForce Now">
          <div class="icon gfn">▶</div>
          <span>GeForce Now</span>
        </a>

        <a href="https://duckduckgo.com/?q=movies" class="app" data-url="https://duckduckgo.com/?q=movies" data-title="Movies">
          <div class="icon">🎬</div>
          <span>Movies</span>
        </a>
        <a href="https://duckduckgo.com/?q=games" class="app" data-url="https://duckduckgo.com/?q=games" data-title="Games">
          <div class="icon">🎮</div>
          <span>Games</span>
        </a>
        <a href="https://duckduckgo.com/?q=ai" class="app" data-url="https://duckduckgo.com/?q=ai" data-title="AI">
          <div class="icon">✦</div>
          <span>AI</span>
        </a>
        <a href="https://duckduckgo.com/?q=play" class="app" data-url="https://duckduckgo.com/?q=play" data-title="Play">
          <div class="icon">▶</div>
          <span>Play</span>
        </a>

        <a href="https://duckduckgo.com/?q=music" class="app" data-url="https://duckduckgo.com/?q=music" data-title="Music">
          <div class="icon">🎵</div>
          <span>Music</span>
        </a>
      </div>
    </div>
  </div>

  <div id="iframe-container" class="iframe-container hidden"></div>

  <script src="script.js"></script>
</body>
</html>
